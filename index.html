<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e0d4fb">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wallet">
<title>Wallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="vf" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#e60000"/><circle cx="12" cy="12" r="5.6" fill="#fff"/><circle cx="13.3" cy="10.6" r="2.4" fill="#e60000"/></symbol>
<symbol id="sp" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#1ed760"/><g fill="none" stroke="#0c0c0c" stroke-width="1.9" stroke-linecap="round"><path d="M6.4 9.2c3.8-1.1 7.9-.8 11.3 1.1"/><path d="M7 12.4c3.2-.9 6.5-.6 9.5 1"/><path d="M7.6 15.4c2.6-.7 5.2-.4 7.7.9"/></g></symbol>
<symbol id="tl" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#1fc7c9"/><rect x="7.6" y="7.6" width="8.8" height="8.8" rx="2.6" transform="rotate(45 12 12)" fill="none" stroke="#fff" stroke-width="1.9"/><circle cx="12" cy="12" r="1.7" fill="#fff"/></symbol>
<symbol id="dc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#5865f2"/><path d="M6.6 9.2c1.6-1 3.3-1.4 5.4-1.4s3.8.4 5.4 1.4c1 2.2 1.4 4.4 1.2 6.6-1.3.9-2.5 1.3-3.5 1.5l-.8-1.2c-.8.2-1.6.2-2.6.2-1 0-1.8 0-2.6-.2l-.8 1.2c-1-.2-2.2-.6-3.5-1.5-.2-2.2.2-4.4 1.2-6.6z" fill="#fff"/><circle cx="9.7" cy="12.4" r="1.2" fill="#5865f2"/><circle cx="14.3" cy="12.4" r="1.2" fill="#5865f2"/></symbol>
<symbol id="ck" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#6a4bd6"/><path d="M12 6.6V12l3.3 2" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs></svg>

<div class="phone">
 <div class="scroll">
  <div class="top">
   <div class="av"><svg viewBox="0 0 44 44"><rect width="44" height="44" fill="#d9d3ea"/><path d="M5 44c2-10 9-13 17-13s15 3 17 13z" fill="#2c2a3a"/><circle cx="22" cy="20.5" r="9.2" fill="#8a5a3c"/><path d="M12.6 19c0-8 5-11 9.6-11s9.2 3 9.2 10.4c-2-4-5-5-9.2-5s-7 2-9.6 5.6z" fill="#1c1410"/><circle cx="18.4" cy="21" r="1" fill="#1c1410"/><circle cx="25.6" cy="21" r="1" fill="#1c1410"/><path d="M14.4 25q7.6 11 15.2 0q-1.8 6-7.6 6t-7.6-6z" fill="#1c1410"/></svg></div>
   <div class="logo">wallet</div>
   <button class="ringbtn" aria-label="Scan"><i></i></button>
  </div>

  <div class="bal" aria-label="Balance zero dollars"><sup>$</sup>0<span class="c">.00</span></div>
  <button class="num" id="copy" aria-label="Copy wallet number"><span>Wallet: 2678900085</span>
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="8.5" y="8.5" width="12" height="12" rx="3"/><path d="M15.5 8.5V6.5a3 3 0 00-3-3h-6a3 3 0 00-3 3v6a3 3 0 003 3h2"/></svg></button>

  <div class="pill"><button>Deposit</button><button>Withdraw</button></div>
  <button class="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>Add new account</button>

  <div class="stack">
   <div class="cash">CASHBACK</div>
   <div class="card notif">
    <div class="lbl">Notification</div>
    <div class="nt"><svg viewBox="0 0 24 24" fill="#6a4bd6"><path d="M8.5 17.5V6.2l9.5-2v11.3" fill="none" stroke="#6a4bd6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="17.5" r="2.7"/><circle cx="15.5" cy="15.5" r="2.7"/></svg>New subscriptions</div>
    <p>You can manage your Spotify subscription as you wish, turn it off an on.</p>
    <div class="nrow"><div class="apps"><svg><use href="#sp"/></svg><svg><use href="#vf"/></svg><svg><use href="#tl"/></svg></div><button class="review">Review all</button></div>
   </div>
  </div>

  <div class="card tx">
   <div class="lbl">Transactions</div>
   <div class="row"><div class="ic"><svg><use href="#vf"/></svg></div><div class="m"><b>Francis Moss</b><span><svg><use href="#ck"/></svg>10:52, pending</span></div><div class="r"><b class="amt">- $1,280<i class="c" style="font-style:normal">.00</i></b><span>Debit card</span></div></div>
   <div class="row"><div class="ic"><svg><use href="#dc"/></svg></div><div class="m"><b>Discord</b><span>09:30</span></div><div class="r"><b class="amt">- $2<i class="c" style="font-style:normal">.00</i></b><span>Debit card</span></div></div>
   <div class="row"><div class="ic"><svg><use href="#sp"/></svg></div><div class="m"><b>Spotify</b><span>Yesterday</span></div><div class="r"><b class="amt">- $9<i class="c" style="font-style:normal">.99</i></b><span>Debit card</span></div></div>
   <div class="row" style="padding-bottom:10px"><div class="ic"><svg><use href="#tl"/></svg></div><div class="m"><b>Amazon</b><span>Yesterday</span></div><div class="r"><b class="amt">- $34<i class="c" style="font-style:normal">.50</i></b><span>Debit card</span></div></div>
  </div>
 </div>

 <nav id="nav">
  <button class="on p" aria-label="Home">p</button>
  <button aria-label="Send"><svg viewBox="0 0 24 24"><path d="M21 3L3 10.4l7 3 3.2 7.1z"/><path d="M10 13.4L21 3"/></svg></button>
  <button aria-label="Cards"><svg viewBox="0 0 24 24"><rect x="3.5" y="9" width="17" height="8.4" rx="2.4" transform="rotate(-45 12 13.2)"/><path d="M9.2 8.6l6.2 6.2"/></svg></button>
  <button aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.2"/><circle cx="12" cy="12" r="2.4"/><path d="M12 2.8v2.2M12 19v2.2M2.8 12H5M19 12h2.2M5.5 5.5l1.6 1.6M16.9 16.9l1.6 1.6M18.5 5.5l-1.6 1.6M7.1 16.9l-1.6 1.6"/></svg></button>
 </nav>
</div>
<script src="script.js"></script>
</body></html>
